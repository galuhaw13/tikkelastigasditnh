        body {

                { id: 510, stimulus: "Jika dalam membuat teh manis kita memasukkan air panas dulu sebelum memasukkan teh dan gula, itu bagian dari...", options: ["Penyusunan urutan langkah (Algoritma)", "Kerusakan hardware CPU", "Pengunduhan file PDF"], answer: 0, explanation: "Itu adalah langkah urutan kerja atau algoritma." },
                { id: 511, stimulus: "Apa yang terjadi jika urutan langkah membuat kue dibolak-balik (misal dipanggang dulu baru adon adonan)?", options: ["Kue menjadi sangat lezat", "Kue gagal dan tidak bisa dimakan", "Oven menjadi dingin"], answer: 1, explanation: "Urutan yang salah akan merusak hasil akhir." },
                { id: 512, stimulus: "Siapa yang harus menyusun algoritma agar komputer dapat mengerjakan tugas dengan benar?", options: ["Manusia (pemrogram)", "Komputer pintar sendiri", "Kucing peliharaan"], answer: 0, explanation: "Manusia menyusun langkah logis untuk dikerjakan komputer." },
                { id: 513, stimulus: "Istilah untuk mencari dan memperbaiki kesalahan susunan perintah disebut...", options: ["Debugging", "Formatting", "Shutdown"], answer: 0, explanation: "Debugging adalah perbaikan kesalahan logika." },
                { id: 514, stimulus: "Manakah yang merupakan ciri utama dari sebuah algoritma yang baik?", options: ["Acak dan membingungkan", "Logis, runtut, dan jelas", "Panjang tanpa ujung"], answer: 1, explanation: "Algoritma yang baik harus logis dan runtut." },
                { id: 515, stimulus: "Jika urutan mencuci piring dimulai dari mengelap piring kering dulu baru disabun, maka urutan ini...", options: ["Keliru dan harus di-debugging", "Sudah sangat benar", "Sangat cepat"], answer: 0, explanation: "Urutan tersebut keliru dan perlu diperbaiki (debugging)." }
            ],
            6: [
                { id: 601, stimulus: "Aplikasi komputer yang asyik digunakan untuk menggambar, melukis, dan mewarnai secara digital di layar monitor adalah...", options: ["Microsoft Word", "Microsoft Paint", "Kalkulator"], answer: 1, explanation: "Microsoft Paint adalah aplikasi menggambar digital." },
                { id: 602, stimulus: "Di dalam Microsoft Paint, ikon berbentuk Pensil (Pencil) berfungsi untuk...", options: ["Menghapus warna gambar", "Menggambar garis bebas tipis layaknya pensil tulis", "Mencetak gambar ke kertas"], answer: 1, explanation: "Pencil digunakan untuk menggambar garis bebas tipis." },
                { id: 603, stimulus: "Ikon Penghapus (Eraser) di Microsoft Paint berfungsi untuk...", options: ["Menghapus bagian gambar atau garis yang salah", "Membuat warna latar belakang jadi gelap", "Menyimpan file otomatis"], answer: 0, explanation: "Eraser berfungsi menghapus bagian gambar yang keliru." },
                { id: 604, stimulus: "Ikon Kaleng Cat Tumpah (Fill with Color) berfungsi untuk...", options: ["Menumpahkan air ke keyboard", "Mewarnai suatu bidang gambar tertutup secara instan dengan satu klik", "Memotong gambar menjadi dua"], answer: 1, explanation: "Fill with Color mewarnai bidang tertutup secara instan." },
                { id: 605, stimulus: "Ikon Huruf A (Text) di Paint berfungsi untuk...", options: ["Menggambar hewan lucu", "Menyisipkan atau mengetik judul tulisan pada lembar gambar", "Menghapus tulisan salah"], answer: 1, explanation: "Text tool digunakan untuk mengetik teks atau judul pada gambar." },
                { id: 606, stimulus: "Ikon Kuas (Brushes) di Microsoft Paint berfungsi untuk...", options: ["Melukis dengan pilihan bentuk garis kuas yang bermacam-macam", "Mematikan komputer", "Mengetik angka matematika"], answer: 0, explanation: "Brushes digunakan untuk melukis dengan berbagai gaya kuas." },
                { id: 607, stimulus: "Di mana kita melihat hasil lukisan digital yang sedang kita buat?", options: ["Di atas meja kayu lab", "Di layar monitor", "Di dalam kotak CPU"], answer: 1, explanation: "Hasil lukisan tampil di layar monitor." },
                { id: 608, stimulus: "Jika kita ingin mewarnai gambar rumah yang tertutup garis dengan warna biru dalam sekali klik, kita menggunakan...", options: ["Pencil", "Eraser", "Fill with Color (Kaleng Cat)"], answer: 2, explanation: "Kaleng cat warna mewarnai bidang tertutup dengan cepat." },
                { id: 609, stimulus: "Apa yang terjadi jika bidang gambar yang ingin kita warnai dengan kaleng cat ternyata ada garis yang bocor (terbuka)?", options: ["Warna akan tumpah memenuhi seluruh lembar kerja", "Gambar menjadi 3 dimensi", "Aplikasi Paint otomatis tertutup"], answer: 0, explanation: "Jika bidang terbuka, warna cat akan keluar memenuhi seluruh layar." },
                { id: 610, stimulus: "Bagaimana cara menyusupkan nama kita pada sudut gambar di Paint?", options: ["Menggunakan ikon Text (Huruf A)", "Menggunakan Eraser", "Menggunakan kaleng cat"], answer: 0, explanation: "Gunakan Text tool untuk menulis nama." },
                { id: 611, stimulus: "Apakah Microsoft Paint termasuk aplikasi perangkat lunak (software)?", options: ["Ya, benar sekali", "Bukan, Paint adalah perangkat keras", "Paint adalah kabel penghubung"], answer: 0, explanation: "Paint adalah software aplikasi." },
                { id: 612, stimulus: "Manakah alat di Paint yang paling cocok untuk membuat coretan garis halus mirip pensil nyata?", options: ["Pencil", "Fill with Color", "Eraser"], answer: 0, explanation: "Pencil tool membuat garis tipis bebas." },
                { id: 613, stimulus: "Apakah kita bisa memilih berbagai jenis bentuk kuas pada menu Brushes di Paint?", options: ["Tidak bisa sama sekali", "Bisa, ada banyak pilihan bentuk kuas", "Hanya ada satu jenis kuas saja"], answer: 1, explanation: "Brushes menyediakan berbagai gaya sapuan kuas." },
                { id: 614, stimulus: "Jika saat menggambar kita salah membuat garis, alat apa yang kita ambil untuk memperbaikinya?", options: ["Eraser (Penghapus)", "Printer", "Keyboard"], answer: 0, explanation: "Eraser digunakan untuk menghapus kesalahan gambar." },
                { id: 615, stimulus: "Setelah selesai melukis pemandangan gunung di Paint, apa perintah selanjutnya agar gambar tersimpan?", options: ["Save / Simpan file", "Delete file", "Cabut kabel monitor"], answer: 0, explanation: "Kita harus melakukan Save agar gambar tersimpan." }
            ]
        };

        // Avatars without any name labels
        const AVATARS = [
            '👦', '👧', '🐱', '🤖', '⭐', '📚', '🚀', '🎨'
        ];

        // --- LOCAL STORAGE INITIALIZATION ---
        function initStorage() {
            if (!localStorage.getItem('tik_chapters')) {
                localStorage.setItem('tik_chapters', JSON.stringify(DEFAULT_CHAPTERS));
            }
            if (!localStorage.getItem('tik_kisi')) {
                localStorage.setItem('tik_kisi', JSON.stringify(DEFAULT_KISI_KISI));
            }
            if (!localStorage.getItem('tik_questions')) {
                localStorage.setItem('tik_questions', JSON.stringify(DEFAULT_QUESTIONS));
            }
            if (!localStorage.getItem('tik_students')) {
                const initialStudents = [
                    { name: "Nama", class: "3A", avatar: "👦", score: 450, history: {} },
                    { name: "Nama", class: "3B", avatar: "👧", score: 420, history: {} },
                    { name: "Nama", class: "3A", avatar: "🤖", score: 380, history: {} },
                    { name: "Nama", class: "3C", avatar: "⭐", score: 350, history: {} }
                ];
                localStorage.setItem('tik_students', JSON.stringify(initialStudents));
            }
        }
        initStorage();

        // --- SESSION STATE & ROUTING ---
        let currentStudent = JSON.parse(sessionStorage.getItem('tik_current_student')) || null;
        let currentView = sessionStorage.getItem('tik_current_view') || (currentStudent ? 'student_dashboard' : 'login');
        let currentActiveChapter = null;
        let activeQuizChapter = null;
        let quizState = JSON.parse(sessionStorage.getItem('tik_quiz_state')) || {};
        let studentActiveMenu = sessionStorage.getItem('tik_student_menu') || 'chapters';
        let adminTab = 'materials';
        let selectedAdminChapter = 1;

        function saveSession() {
            if (currentStudent) {
                sessionStorage.setItem('tik_current_student', JSON.stringify(currentStudent));
            } else {
                sessionStorage.removeItem('tik_current_student');
            }
            sessionStorage.setItem('tik_current_view', currentView);
            sessionStorage.setItem('tik_student_menu', studentActiveMenu);
            sessionStorage.setItem('tik_quiz_state', JSON.stringify(quizState));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-amber-500 text-white';
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl font-medium flex items-center gap-3 transform translate-y-2 opacity-0 transition-all duration-300 ${bgCol}`;
            toast.innerHTML = `<span>${type === 'success' ? '🎉' : '⚠️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentView === 'login') {
                app.innerHTML = renderLoginScreen();
            } else if (currentView === 'student_dashboard') {
                app.innerHTML = renderStudentPortal();
            } else if (currentView === 'admin_login') {
                app.innerHTML = renderAdminLoginScreen();
            } else if (currentView === 'admin_dashboard') {
                app.innerHTML = renderAdminPortal();
            }

            lucide.createIcons();
        }

        // --- 1. STUDENT LOGIN SCREEN ---
        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 border-4 border-amber-300 relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-200 rounded-full blur-2xl opacity-50"></div>
                        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-sky-200 rounded-full blur-2xl opacity-50"></div>

                        <div class="text-center mb-6 relative">
                            <span class="inline-block text-5xl mb-2 bounce-gentle">💻</span>
                            <h1 class="text-2xl font-extrabold text-sky-700">PORTAL BELAJAR TIK</h1>
                            <p class="text-sm font-semibold text-amber-600 mt-1">Kelas 3 SD - Semester II</p>
                        </div>

                        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 relative">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Nama Lengkap Siswa:</label>
                                <input type="text" id="student-name" required placeholder="Contoh: Ahmad Haidar" 
                                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none font-medium">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Kelas:</label>
                                <select id="student-class" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none font-medium bg-white">
                                    <option value="3A">Kelas 3A</option>
                                    <option value="3B">Kelas 3B</option>
                                    <option value="3C">Kelas 3C</option>
                                    <option value="3D">Kelas 3D</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Pilih Avatar:</label>
                                <div class="grid grid-cols-4 gap-3">
                                    ${AVATARS.map((av, idx) => `
                                        <label class="flex items-center justify-center p-3 rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-sky-400 hover:bg-sky-50 transition-all avatar-label ${idx === 0 ? 'border-sky-500 bg-sky-50 ring-2 ring-sky-300' : ''}">
                                            <input type="radio" name="avatar" value="${av}" ${idx === 0 ? 'checked' : ''} class="sr-only" onchange="selectAvatarUI(this)">
                                            <span class="text-3xl">${av}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                            <button type="submit" class="w-full py-4 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-900 font-extrabold rounded-2xl shadow-lg transform active:scale-95 transition-all text-lg flex items-center justify-center gap-2 mt-4">
                                <span>🚀 Masuk Portal Siswa</span>
                            </button>
                        </form>

                        <div class="mt-6 text-center border-t border-slate-100 pt-4">
                            <button onclick="goToAdminLogin()" class="text-xs font-bold text-slate-400 hover:text-sky-600 transition-colors flex items-center justify-center gap-1 mx-auto">
                                <i data-lucide="shield-check" class="w-4 h-4"></i> Login Portal Guru / Admin
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectAvatarUI(radio) {
            document.querySelectorAll('.avatar-label').forEach(lbl => {
                lbl.classList.remove('border-sky-500', 'bg-sky-50', 'ring-2', 'ring-sky-300');
            });
            radio.closest('label').classList.add('border-sky-500', 'bg-sky-50', 'ring-2', 'ring-sky-300');
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const clazz = document.getElementById('student-class').value;
            const avatar = document.querySelector('input[name="avatar"]:checked').value;

            currentStudent = { name, class: clazz, avatar, score: 0, history: {} };
            
            let students = JSON.parse(localStorage.getItem('tik_students')) || [];
            let existing = students.find(s => s.name.toLowerCase() === name.toLowerCase());
            if (existing) {
                currentStudent.score = existing.score;
            } else {
                students.push(currentStudent);
                localStorage.setItem('tik_students', JSON.stringify(students));
            }

            currentView = 'student_dashboard';
            studentActiveMenu = 'chapters';
            saveSession();
            render();
            showToast(`Ahlan wa sahlan, ${name}! Selamat belajar.`);
        }

        // --- 2. ADMIN LOGIN SCREEN ---
        function renderAdminLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 border-4 border-slate-300">
                        <div class="text-center mb-6">
                            <span class="inline-block text-5xl mb-2">🔒</span>
                            <h1 class="text-2xl font-extrabold text-slate-800">PORTAL GURU / ADMIN</h1>
                            <p class="text-sm font-semibold text-slate-500 mt-1">Masukkan PIN Akses</p>
                        </div>
                        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">PIN Admin:</label>
                                <input type="password" id="admin-pin" required placeholder="Masukkan PIN" 
                                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none font-medium">
                            </div>
                            <button type="submit" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-2xl shadow-lg transition-all text-lg">
                                Masuk Panel Admin
                            </button>
                        </form>
                        <div class="mt-6 text-center">
                            <button onclick="currentView='login'; render();" class="text-sm font-bold text-sky-600 hover:underline">
                                &larr; Kembali ke Portal Siswa
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('admin-pin').value;
            if (pin === 'admin135' || pin === 'admin') {
                currentView = 'admin_dashboard';
                saveSession();
                render();
                showToast("Berhasil masuk sebagai Admin/Guru!", "success");
            } else {
                showToast("PIN Admin salah!", "error");
            }
        }

        function goToAdminLogin() {
            currentView = 'admin_login';
            render();
        }

        // --- 3. STUDENT PORTAL DASHBOARD ---
        function renderStudentPortal() {
            const chapters = JSON.parse(localStorage.getItem('tik_chapters'));
            const kisi = JSON.parse(localStorage.getItem('tik_kisi'));
            const students = JSON.parse(localStorage.getItem('tik_students')) || [];
            students.sort((a,b) => b.score - a.score);

            return `
                <header class="bg-white/90 backdrop-blur-md shadow-md sticky top-0 z-40 border-b border-amber-200">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-amber-300 rounded-2xl flex items-center justify-center text-2xl shadow-inner">${currentStudent.avatar}</div>
                            <div>
                                <h2 class="font-extrabold text-slate-800 text-base leading-tight">${currentStudent.name}</h2>
                                <p class="text-xs font-bold text-sky-600">Kelas ${currentStudent.class} | Poin: <span class="text-amber-600 font-extrabold">${currentStudent.score} ⭐</span></p>
                            </div>
                        </div>

                        <div class="flex items-center gap-1 sm:gap-2 overflow-x-auto py-1">
                            <button onclick="switchStudentMenu('chapters')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all flex items-center gap-1.5 ${studentActiveMenu === 'chapters' ? 'bg-sky-500 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                <i data-lucide="book-open" class="w-4 h-4"></i> Materi
                            </button>
                            <button onclick="switchStudentMenu('quiz')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all flex items-center gap-1.5 ${studentActiveMenu === 'quiz' ? 'bg-amber-500 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                <i data-lucide="help-circle" class="w-4 h-4"></i> Kuis
                            </button>
                            <button onclick="switchStudentMenu('kisi')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all flex items-center gap-1.5 ${studentActiveMenu === 'kisi' ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                <i data-lucide="file-text" class="w-4 h-4"></i> Kisi-Kisi PSAS
                            </button>
                            <button onclick="switchStudentMenu('leaderboard')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all flex items-center gap-1.5 ${studentActiveMenu === 'leaderboard' ? 'bg-purple-500 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                <i data-lucide="trophy" class="w-4 h-4"></i> Leaderboard
                            </button>
                        </div>

                        <div class="flex items-center gap-2">
                            <button onclick="manualLogout()" class="px-3 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs rounded-xl transition-all flex items-center gap-1">

                    ${studentActiveMenu === 'chapters' ? renderChaptersView(chapters) : ''}
                    ${studentActiveMenu === 'quiz' ? renderQuizView() : ''}
                    ${studentActiveMenu === 'kisi' ? renderKisiView(kisi) : ''}

                </main>

                ${currentActiveChapter !== null ? renderChapterModal(chapters.find(c => c.id === currentActiveChapter)) : ''}
            `;
        }

        function switchStudentMenu(menu) {
            studentActiveMenu = menu;
            saveSession();
            render();
        }

        function manualLogout() {
            sessionStorage.removeItem('tik_current_student');
            sessionStorage.removeItem('tik_current_view');

        // --- QUIZ VIEW (STATE PERSISTENCE ON MENU SWITCH) ---
        function renderQuizView() {
            const allQuestions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
            const chapters = JSON.parse(localStorage.getItem('tik_chapters'));

            if (!activeQuizChapter) {
                return `

                            const isCompleted = currentStudent.history && currentStudent.history[ch.id];
                            return `

                                    <div>
                                        <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center font-extrabold text-lg shadow-inner mb-4">
                                            Q${ch.id}
                                        </div>
                                        <h3 class="font-extrabold text-slate-800 text-lg mb-2">Kuis Bab ${ch.id}</h3>
                                        <p class="text-slate-600 text-sm mb-4">${ch.title}</p>
                                        <p class="text-xs font-bold text-slate-400">${qList.length} Soal Tersedia</p>
                                    </div>
                                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                                        <span class="text-xs font-extrabold ${isCompleted ? 'text-emerald-600' : 'text-amber-600'}">
                                            ${isCompleted ? '✅ Selesai Dikerjakan' : '⭐ Belum Dikerjakan'}
                                        </span>
                                        <button onclick="startQuiz(${ch.id})" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-sm rounded-xl shadow transition-all">
                                            Mulai Kuis &rarr;
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            const qList = allQuestions[activeQuizChapter] || [];
            if (!quizState[activeQuizChapter]) {
                quizState[activeQuizChapter] = { currentIndex: 0, score: 0, answers: {}, finished: false };
            }
            const st = quizState[activeQuizChapter];

            if (st.finished || st.currentIndex >= qList.length) {
                return `
                    <div class="max-w-xl mx-auto bg-white rounded-3xl p-8 shadow-2xl border-4 border-amber-300 text-center">
                        <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 bounce-gentle">🏆</div>
                        <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Kuis Bab ${activeQuizChapter} Selesai!</h2>
                        <p class="text-slate-600 mb-6">Barakallahu fiik! Kamu telah menyelesaikan seluruh soal pada bab ini.</p>
                        <div class="bg-amber-50 p-6 rounded-2xl border border-amber-200 mb-6">
                            <p class="text-sm font-bold text-slate-500">Poin Diperoleh pada Kuis Ini:</p>
                            <p class="text-4xl font-extrabold text-amber-600 mt-1">+${st.score} ⭐</p>
                        </div>
                        <button onclick="finishQuizChapter(${activeQuizChapter})" class="w-full py-4 bg-sky-500 hover:bg-sky-600 text-white font-extrabold rounded-2xl shadow-lg transition-all text-lg">
                            Kembali ke Daftar Kuis
                        </button>
                    </div>
                `;
            }

            const q = qList[st.currentIndex];
            const answeredData = st.answers[st.currentIndex];

            return `
                <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-2 border-slate-100">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                        <div class="flex items-center gap-2">
                            <button onclick="activeQuizChapter = null; render();" class="text-xs font-bold text-sky-600 hover:underline">&larr; Keluar Kuis</button>
                            <span class="text-slate-300">|</span>
                            <span class="text-xs font-extrabold text-amber-600 bg-amber-50 px-3 py-1 rounded-full">Bab ${activeQuizChapter}</span>
                        </div>
                        <span class="text-xs font-extrabold text-slate-500">Soal ${st.currentIndex + 1} dari ${qList.length}</span>
                    </div>

                    <div class="mb-6">
                        <h3 class="text-lg sm:text-xl font-extrabold text-slate-800 content-andika leading-relaxed mb-4">
                            ${q.stimulus}
                        </h3>
                    </div>

                    <div class="space-y-3 mb-6">
                        ${q.options.map((opt, oIdx) => {
                            let btnStyle = "border-slate-200 hover:border-sky-400 hover:bg-sky-50 text-slate-700 bg-white";
                            if (answeredData !== undefined) {
                                if (oIdx === q.answer) {
                                    btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-300";
                                } else if (answeredData === oIdx && oIdx !== q.answer) {
                                    btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-bold ring-2 ring-rose-300";
                                } else {
                                    btnStyle = "border-slate-200 opacity-50 bg-white text-slate-400";
                                }
                            }
                            return `
                                <button onclick="answerQuizOption(${oIdx})" ${answeredData !== undefined ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center justify-between font-medium ${btnStyle}">
                                    <span class="flex items-center gap-3">
                                        <span class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center font-extrabold text-xs text-slate-600">${String.fromCharCode(65 + oIdx)}</span>
                                        <span class="content-andika">${opt}</span>
                                    </span>
                                    ${answeredData !== undefined && oIdx === q.answer ? '<span class="text-emerald-600 font-bold">✔ Benar</span>' : ''}
                                    ${answeredData !== undefined && answeredData === oIdx && oIdx !== q.answer ? '<span class="text-rose-600 font-bold">✖ Salah</span>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    ${answeredData !== undefined ? `
                        <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 mb-6">
                            <p class="font-bold text-amber-900 text-sm mb-1">💡 Penjelasan:</p>
                            <p class="text-slate-700 text-sm content-andika">${q.explanation}</p>
                        </div>
                        <div class="flex justify-end">
                            <button onclick="nextQuizQuestion()" class="px-6 py-3 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-900 font-extrabold rounded-2xl shadow-lg hover:from-amber-500 hover:to-amber-600 transition-all flex items-center gap-2">
                                ${st.currentIndex + 1 >= qList.length ? 'Selesaikan Kuis 🏁' : 'Soal Berikutnya &rarr;'}
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function startQuiz(chapterId) {
            activeQuizChapter = chapterId;
            if (!quizState[chapterId]) {
                quizState[chapterId] = { currentIndex: 0, score: 0, answers: {}, finished: false };
            }
            saveSession();
            render();
        }

        function answerQuizOption(optIdx) {
            const allQuestions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
            const qList = allQuestions[activeQuizChapter];
            const st = quizState[activeQuizChapter];
            const q = qList[st.currentIndex];

            st.answers[st.currentIndex] = optIdx;
            if (optIdx === q.answer) {
                st.score += 10;
            }
            saveSession();
            render();
        }

        function nextQuizQuestion() {
            const allQuestions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
            const qList = allQuestions[activeQuizChapter];
            const st = quizState[activeQuizChapter];

            if (st.currentIndex + 1 < qList.length) {
                st.currentIndex += 1;
            } else {
                st.finished = true;
                currentStudent.score += st.score;
                currentStudent.history = currentStudent.history || {};
                currentStudent.history[activeQuizChapter] = st.score;

                let students = JSON.parse(localStorage.getItem('tik_students')) || [];
                let idx = students.findIndex(s => s.name.toLowerCase() === currentStudent.name.toLowerCase());
                if (idx !== -1) {
                    students[idx].score = currentStudent.score;
                } else {
                    students.push(currentStudent);
                }
                localStorage.setItem('tik_students', JSON.stringify(students));
                showToast(`Kuis selesai! Kamu mendapat +${st.score} Poin ⭐`);
            }
            saveSession();
            render();
        }

        function finishQuizChapter(chapterId) {
            activeQuizChapter = null;
            saveSession();
            render();
        }

                                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200">

                            </div>

                        <div class="pt-4 border-t border-slate-100">
                            <h4 class="text-sm font-bold text-slate-700 mb-2">Tambah Tautan Google Drive Baru:</h4>
                            <form onsubmit="handleAddDrivePdf(event, ${ch.id})" class="space-y-3">

                                    <input type="url" id="new-pdf-url" required placeholder="URL Google Drive (https://drive.google.com/...)" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium">

        function handleSaveSummary(e, chapterId) {
            e.preventDefault();
            const title = document.getElementById('edit-ch-title').value;
            const summary = document.getElementById('edit-ch-summary').value;

            let chapters = JSON.parse(localStorage.getItem('tik_chapters'));
            let ch = chapters.find(c => c.id === chapterId);
            if (ch) {
                ch.title = title;
                ch.summary = summary;
                localStorage.setItem('tik_chapters', JSON.stringify(chapters));
                showToast(`Ringkasan Bab ${chapterId} berhasil diperbarui!`);
                render();
            }
        }

        function handleAddDrivePdf(e, chapterId) {
            e.preventDefault();
            const name = document.getElementById('new-pdf-name').value;
            const url = document.getElementById('new-pdf-url').value;

            let chapters = JSON.parse(localStorage.getItem('tik_chapters'));
            let ch = chapters.find(c => c.id === chapterId);
            if (ch.pdfs.length >= 3) {
                showToast("Maksimal 3 tautan PDF per bab!", "error");
                return;
            }

            ch.pdfs.push({ name, url });
            localStorage.setItem('tik_chapters', JSON.stringify(chapters));
            showToast(`Tautan ${name} berhasil ditambahkan!`);
            render();
        }

        function handleDeletePdf(chapterId, pdfIdx) {
            let chapters = JSON.parse(localStorage.getItem('tik_chapters'));
            let ch = chapters.find(c => c.id === chapterId);
            ch.pdfs.splice(pdfIdx, 1);
            localStorage.setItem('tik_chapters', JSON.stringify(chapters));
            showToast("Tautan PDF berhasil dihapus.");
            render();
        }

        // --- ADMIN: QUESTIONS MANAGEMENT ---
        function renderAdminQuestions(questions, chapters) {
            const chId = selectedAdminChapter;
            const qList = questions[chId] || [];

            return `
                <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
                    <div>

                <div class="space-y-4">

                                <div class="flex items-center gap-2 mb-1">

                                    <span class="text-xs font-bold text-emerald-600">Jawaban Benar: Opsi ${['A','B','C'][q.answer]}</span>

                                <p class="font-extrabold text-slate-800 text-sm content-andika mb-2">${q.stimulus}</p>

                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openEditQuestionModal(${chId}, ${qIdx})" class="px-3 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-700 font-bold text-xs rounded-lg transition-all">
                                    Edit
                                </button>
                                <button onclick="handleDeleteQuestion(${chId}, ${qIdx})" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs rounded-lg transition-all">

                <div id="question-modal-container"></div>

        function openAddQuestionModal(chapterId) {
            const container = document.getElementById('question-modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-4 border-amber-300">
                        <h3 class="text-lg font-extrabold text-slate-800 mb-4">Tambah Soal Baru Bab ${chapterId}</h3>
                        <form onsubmit="handleSaveNewQuestion(event, ${chapterId})" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Stimulus / Pertanyaan:</label>
                                <textarea id="new-q-stimulus" required rows="3" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium focus:outline-none focus:border-sky-500"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Pilihan A:</label>

                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Pilihan C:</label>
                                <input type="text" id="new-q-opt2" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium">

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Jawaban Benar:</label>
                                <select id="new-q-answer" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium bg-white">

                                    <option value="2">Opsi C</option>
                                </select>

                                <textarea id="new-q-exp" required rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium"></textarea>

                            <div class="flex justify-end gap-2 pt-3">

                                <button type="submit" class="px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow">Simpan Soal</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleSaveNewQuestion(e, chapterId) {
            e.preventDefault();
            const stimulus = document.getElementById('new-q-stimulus').value;
            const opt0 = document.getElementById('new-q-opt0').value;
            const opt1 = document.getElementById('new-q-opt1').value;
            const opt2 = document.getElementById('new-q-opt2').value;
            const answer = parseInt(document.getElementById('new-q-answer').value);
            const explanation = document.getElementById('new-q-exp').value;

            let questions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
            if (!questions[chapterId]) questions[chapterId] = [];

            questions[chapterId].push({
                id: Date.now(),
                stimulus,
                options: [opt0, opt1, opt2],
                answer,
                explanation
            });

            localStorage.setItem('tik_questions', JSON.stringify(questions));
            showToast("Soal kuis baru berhasil ditambahkan!");
            render();
        }

        function openEditQuestionModal(chapterId, qIdx) {
            let questions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
            const q = questions[chapterId][qIdx];

            const container = document.getElementById('question-modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-4 border-amber-300">
                        <h3 class="text-lg font-extrabold text-slate-800 mb-4">Edit Soal #${qIdx + 1} Bab ${chapterId}</h3>
                        <form onsubmit="handleUpdateQuestion(event, ${chapterId}, ${qIdx})" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Stimulus / Pertanyaan:</label>
                                <textarea id="edit-q-stimulus" required rows="3" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium">${q.stimulus}</textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Pilihan A:</label>
                                <input type="text" id="edit-q-opt0" value="${q.options[0]}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Pilihan B:</label>
                                <input type="text" id="edit-q-opt1" value="${q.options[1]}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Pilihan C:</label>
                                <input type="text" id="edit-q-opt2" value="${q.options[2]}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Jawaban Benar:</label>
                                <select id="edit-q-answer" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium bg-white">
                                    <option value="0" ${q.answer === 0 ? 'selected' : ''}>Opsi A</option>
                                    <option value="1" ${q.answer === 1 ? 'selected' : ''}>Opsi B</option>
                                    <option value="2" ${q.answer === 2 ? 'selected' : ''}>Opsi C</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Penjelasan Jawaban:</label>
                                <textarea id="edit-q-exp" required rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium">${q.explanation}</textarea>
                            </div>
                            <div class="flex justify-end gap-2 pt-3">
                                <button type="button" onclick="document.getElementById('question-modal-container').innerHTML=''" class="px-4 py-2 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl">Batal</button>
                                <button type="submit" class="px-4 py-2 bg-sky-600 text-white font-bold text-xs rounded-xl shadow">Perbarui Soal</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleUpdateQuestion(e, chapterId, qIdx) {
            e.preventDefault();
            const stimulus = document.getElementById('edit-q-stimulus').value;
            const opt0 = document.getElementById('edit-q-opt0').value;
            const opt1 = document.getElementById('edit-q-opt1').value;
            const opt2 = document.getElementById('edit-q-opt2').value;
            const answer = parseInt(document.getElementById('edit-q-answer').value);
            const explanation = document.getElementById('edit-q-exp').value;

            let questions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
            questions[chapterId][qIdx] = {
                id: questions[chapterId][qIdx].id,
                stimulus,
                options: [opt0, opt1, opt2],
                answer,
                explanation
            };

            localStorage.setItem('tik_questions', JSON.stringify(questions));
            showToast("Soal kuis berhasil diperbarui!");
            render();
        }

        function handleDeleteQuestion(chapterId, qIdx) {
            if (confirm("Yakin ingin menghapus soal ini?")) {
                let questions = JSON.parse(localStorage.getItem('tik_questions')) || DEFAULT_QUESTIONS;
                questions[chapterId].splice(qIdx, 1);
                localStorage.setItem('tik_questions', JSON.stringify(questions));
                showToast("Soal berhasil dihapus.");
                render();

        // --- ADMIN: KISI-KISI MANAGEMENT ---

                <div class="space-y-6">

                                    <input type="text" id="kisi-title-${idx}" value="${item.title}" class="font-extrabold text-slate-800 text-lg border-b border-transparent hover:border-slate-300 focus:border-sky-500 focus:outline-none flex-1">

        function handleSaveKisi(e, idx) {

        // --- ADMIN: STUDENTS MONITOR ---
        function renderAdminStudents(students) {
            return `

        function handleResetLeaderboard() {
            if (confirm("Yakin ingin mereset seluruh skor siswa?")) {
                localStorage.removeItem('tik_students');
                initStorage();
                showToast("Leaderboard berhasil direset.");
                render();

        }

        // Initial Boot
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
