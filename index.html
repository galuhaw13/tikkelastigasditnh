        // --- LOCAL STORAGE INITIALIZATION & SYNC ---
        function initStorage() {
            if (!localStorage.getItem('tik_chapters')) {
                localStorage.setItem('tik_chapters', JSON.stringify(DEFAULT_CHAPTERS));
            }
            if (!localStorage.getItem('tik_kisi')) {
                localStorage.setItem('tik_kisi', JSON.stringify(DEFAULT_KISI_KISI));
            }
            if (!localStorage.getItem('tik_questions')) {
                localStorage.setItem('tik_questions', JSON.stringify(DEFAULT_QUESTIONS));
            }
            if (!localStorage.getItem('tik_leaderboard')) {
                localStorage.setItem('tik_leaderboard', JSON.stringify(DEFAULT_LEADERBOARD));
            }
        }

        function getData(key) {
            initStorage();
            return JSON.parse(localStorage.getItem(key));
        }

        function saveData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
            showToast("Perubahan berhasil disimpan & disinkronkan!", "success");
        }

        // --- STATE MANAGEMENT ---
        let currentUser = JSON.parse(localStorage.getItem('tik_current_user')) || null;
        let activeTab = localStorage.getItem('tik_active_tab') || 'materi';
        let currentQuizChapter = null;
        let currentQuizIndex = 0;
        let quizAnswersState = JSON.parse(localStorage.getItem('tik_quiz_answers')) || {}; // simpan progres kuis per bab agar tidak hilang saat pindah menu
        let userScore = currentUser ? currentUser.score : 0;

        // Auto Logout handling (Tab Close vs Refresh)
        window.addEventListener('beforeunload', (e) => {
            // Jika refresh, session storage tetap ada, jika tab close total, hapus current user
            if (!sessionStorage.getItem('is_refreshed')) {
                localStorage.removeItem('tik_current_user');
            }
        });
        window.addEventListener('load', () => {
            sessionStorage.setItem('is_refreshed', 'true');
            initStorage();
            renderApp();
            lucide.createIcons();
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white font-medium shadow-lg transition transform duration-300 pointer-events-auto flex items-center gap-2 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i> <span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- ROUTER / RENDER CONTROLLER ---
        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!currentUser) {
                renderLoginPortal(app);
            } else if (currentUser.isAdmin) {
                renderAdminPortal(app);
            } else {
                renderStudentPortal(app);
            }
            lucide.createIcons();
        }

            currentUser = { name: nama, class: kelas, avatar: selectedAvatarSymbol, score: 0, isAdmin: false };

        // --- RENDER KUIS (15 SOAL PER BAB DENGAN STIMULUS & PENJELASAN) ---
        function renderKuisView(container) {
            const allQuestions = getData('tik_questions');
            let html = `

            for (let i = 1; i <= 6; i++) {

                html += `
                    <div class="bg-white rounded-3xl shadow-lg p-6 border-2 border-slate-100 flex flex-col justify-between transition hover:border-amber-300">

        function startQuiz(chapterId) {
            currentQuizChapter = chapterId;
            currentQuizIndex = quizAnswersState[chapterId]?.currentIndex || 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const allQuestions = getData('tik_questions');
            const questions = allQuestions[currentQuizChapter] || [];
            if (questions.length === 0) {
                showToast("Soal untuk bab ini belum tersedia.", "error");
                return;
            }

            if (currentQuizIndex >= questions.length) {
                // Kuis Selesai
                const area = document.getElementById('student-content-area');
                area.innerHTML = `
                    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-amber-300">
                        <div class="w-20 h-20 bg-amber-400 text-white rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-lg bounce-gentle mb-4">
                            🏆
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Kuis Bab ${currentQuizChapter} Selesai!</h2>
                        <p class="text-slate-600 text-sm mb-6">Hebat sekali! Kamu telah menyelesaikan seluruh soal pada bab ini dengan luar biasa.</p>
                        <button onclick="currentQuizChapter = null; renderStudentContent();" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition">
                            Kembali ke Menu Kuis
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const q = questions[currentQuizIndex];
            const area = document.getElementById('student-content-area');
            
            // Cek apakah soal ini sudah pernah dijawab sebelumnya di state
            const savedState = quizAnswersState[currentQuizChapter]?.[q.id];

            area.innerHTML = `
                <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-6 sm:p-8 border-2 border-amber-200">
                    <div class="flex items-center justify-between mb-6">
                        <button onclick="currentQuizChapter = null; renderStudentContent();" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center gap-1 transition">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Menu Kuis
                        </button>
                        <span class="px-3 py-1 bg-amber-100 text-amber-800 font-extrabold text-xs rounded-full">
                            Soal ${currentQuizIndex + 1} dari ${questions.length} (Bab ${currentQuizChapter})
                        </span>
                    </div>

                    <!-- Stimulus / Pertanyaan -->
                    <div class="bg-amber-50/70 border border-amber-200 p-5 rounded-2xl mb-6">
                        <h3 class="font-bold text-slate-800 text-base sm:text-lg content-andika">
                            ${q.stimulus}
                        </h3>
                    </div>

                    <!-- Pilihan A, B, C -->
                    <div class="space-y-3 mb-6" id="quiz-options-container">
                        ${q.options.map((opt, idx) => {
                            let btnStyle = "border-slate-200 hover:border-amber-400 bg-white text-slate-700";
                            let iconMark = String.fromCharCode(65 + idx);
                            if (savedState !== undefined) {
                                if (idx === q.answer) {
                                    btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
                                    iconMark = "✅";
                                } else if (idx === savedState && savedState !== q.answer) {
                                    btnStyle = "border-rose-500 bg-rose-50 text-rose-900";
                                    iconMark = "❌";
                                } else {
                                    btnStyle = "border-slate-200 bg-slate-50 opacity-60 text-slate-400";
                                }
                            }
                            return `
                                <button onclick="answerQuiz(${q.id}, ${idx}, ${q.answer})" ${savedState !== undefined ? 'disabled' : ''} class="w-full text-left p-4 rounded-xl border-2 ${btnStyle} transition flex items-center gap-3 font-medium">
                                    <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-sm shrink-0">${iconMark}</span>
                                    <span>${opt}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- Penjelasan & Tombol Lanjut -->
                    <div id="quiz-feedback-box" class="${savedState !== undefined ? '' : 'hidden'} bg-sky-50 border border-sky-200 p-4 rounded-2xl mb-6">
                        <h4 class="font-bold text-sky-900 text-sm mb-1 flex items-center gap-1.5"><i data-lucide="info" class="w-4 h-4"></i> Penjelasan:</h4>
                        <p class="text-sky-800 text-sm content-andika">${q.explanation}</p>
                    </div>

                    <div class="flex justify-end">
                        <button id="next-quiz-btn" onclick="nextQuizQuestion()" class="${savedState !== undefined ? '' : 'hidden'} px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-xl shadow transition flex items-center gap-2">
                            <span>Soal Selanjutnya</span> <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function answerQuiz(questionId, selectedIdx, correctIdx) {
            if (!quizAnswersState[currentQuizChapter]) {
                quizAnswersState[currentQuizChapter] = { currentIndex: currentQuizIndex };
            }
            quizAnswersState[currentQuizChapter][questionId] = selectedIdx;
            localStorage.setItem('tik_quiz_answers', JSON.stringify(quizAnswersState));

            // Jika benar, tambah poin
            if (selectedIdx === correctIdx) {
                currentUser.score += 10;
                localStorage.setItem('tik_current_user', JSON.stringify(currentUser));
                updateLeaderboardScore(currentUser.name, currentUser.score);
                document.getElementById('header-score').innerText = currentUser.score;
                showToast("Jawaban Benar! +10 Poin", "success");
            } else {
                showToast("Kurang tepat, yuk pelajari penjelasannya!", "error");
            }

            renderQuizQuestion();
        }

        function nextQuizQuestion() {
            currentQuizIndex++;
            if (!quizAnswersState[currentQuizChapter]) {
                quizAnswersState[currentQuizChapter] = {};
            }
            quizAnswersState[currentQuizChapter].currentIndex = currentQuizIndex;
            localStorage.setItem('tik_quiz_answers', JSON.stringify(quizAnswersState));
            renderQuizQuestion();
        }

        function updateLeaderboardScore(name, score) {
            let lb = getData('tik_leaderboard');
            let userEntry = lb.find(u => u.name.toLowerCase() === name.toLowerCase());
            if (userEntry) {
                userEntry.score = Math.max(userEntry.score, score);
            } else {
                lb.push({ name: name, class: currentUser.class, score: score, avatar: currentUser.avatar });
            }
            lb.sort((a, b) => b.score - a.score);
            saveData('tik_leaderboard', lb);
        }

                <div class="mb-6">
                    <h2 class="text-2xl font-extrabold text-slate-800">Kelola Rangkuman Materi & Tautan PDF Google Drive</h2>
                    <p class="text-slate-600 text-sm">Ubah ringkasan atau tambahkan hingga 3 tautan PDF Google Drive per bab yang otomatis tersinkron ke siswa.</p>
                </div>
                <div class="space-y-6">
            `;

            chapters.forEach(ch => {
                let pdfInputs = '';
                for (let i = 0; i < 3; i++) {
                    const pdf = ch.pdfs[i] || { name: '', url: '' };
                    pdfInputs += `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                            <input type="text" id="pdf-name-${ch.id}-${i}" value="${pdf.name}" placeholder="Nama File (Contoh: Bab1.pdf)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium">
                            <input type="text" id="pdf-url-${ch.id}-${i}" value="${pdf.url}" placeholder="URL Google Drive (https://...)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium">
                        </div>
                    `;
                }

                html += `
                    <div class="bg-white rounded-3xl shadow-md p-6 border-2 border-slate-100">
                        <h3 class="font-extrabold text-lg text-slate-800 mb-3 flex items-center gap-2">
                            <span class="w-8 h-8 bg-indigo-100 text-indigo-700 rounded-xl flex items-center justify-center text-sm">${ch.id}</span>
                            <span>Bab ${ch.id}: ${ch.title}</span>
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Judul Bab</label>
                                <input type="text" id="ch-title-${ch.id}" value="${ch.title}" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-indigo-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ringkasan Materi</label>
                                <textarea id="ch-summary-${ch.id}" rows="4" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-indigo-500 focus:outline-none content-andika">${ch.summary}</textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Daftar PDF Google Drive (Maksimal 3 File)</label>
                                ${pdfInputs}
                            </div>
                            <div class="flex justify-end pt-2">
                                <button onclick="saveChapterChanges(${ch.id})" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow transition flex items-center gap-1.5">
                                    <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan Bab ${ch.id}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function saveChapterChanges(id) {
            let chapters = getData('tik_chapters');
            let ch = chapters.find(c => c.id === id);
            if (!ch) return;

            ch.title = document.getElementById(`ch-title-${id}`).value;
            ch.summary = document.getElementById(`ch-summary-${id}`).value;
            
            let newPdfs = [];
            for (let i = 0; i < 3; i++) {
                const name = document.getElementById(`pdf-name-${id}-${i}`).value.trim();
                const url = document.getElementById(`pdf-url-${id}-${i}`).value.trim();
                if (url) {
                    newPdfs.push({ name: name || `Materi_Bab${id}_File${i+1}.pdf`, url: url });
                }
            }
            ch.pdfs = newPdfs;

            saveData('tik_chapters', chapters);
            renderAdminContent();
        }

        // --- ADMIN: KELOLA SOAL KUIS ---
        function renderAdminSoal(container) {
            let html = `
                <div class="mb-6">
                    <h2 class="text-2xl font-extrabold text-slate-800">Kelola Soal Kuis (Bab 1 - 6)</h2>
                    <p class="text-slate-600 text-sm">Pilih Bab untuk melihat, mengedit, atau menambah soal kuis beserta stimulus dan penjelasannya.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
            `;

            for (let i = 1; i <= 6; i++) {
                html += `
                    <button onclick="renderAdminChapterQuestions(${i})" class="p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-indigo-400 shadow-sm transition text-left flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-indigo-600 uppercase">Bab ${i}</span>
                            <h3 class="font-extrabold text-slate-800 text-base">Kelola Soal Bab ${i}</h3>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
                    </button>
                `;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderAdminChapterQuestions(chapterId) {
            const allQuestions = getData('tik_questions');
            const questions = allQuestions[chapterId] || [];

            let qListHtml = '';
            questions.forEach((q, idx) => {
                qListHtml += `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-extrabold text-indigo-600">Soal #${idx + 1} (ID: ${q.id})</span>
                            <button onclick="deleteQuestion(${chapterId}, ${q.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold flex items-center gap-1">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus
                            </button>
                        </div>
                        <p class="font-bold text-slate-800 text-sm mb-3">${q.stimulus}</p>
                        <div class="space-y-1 mb-3">
                            ${q.options.map((opt, oIdx) => `
                                <div class="text-xs text-slate-600 flex items-center gap-2 ${oIdx === q.answer ? 'font-bold text-emerald-700' : ''}">
                                    <span>${String.fromCharCode(65 + oIdx)}.</span> <span>${opt}</span> ${oIdx === q.answer ? '✅ (Jawaban Benar)' : ''}
                                </div>
                            `).join('')}
                        </div>
                        <p class="text-xs text-slate-500 bg-slate-50 p-2 rounded-xl border"><strong>Penjelasan:</strong> ${q.explanation}</p>
                    </div>
                `;
            });

            const area = document.getElementById('admin-content-area');
            area.innerHTML = `
                <div class="mb-4 flex items-center justify-between">
                    <button onclick="switchAdminTab('soal')" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Daftar Bab Soal
                    </button>
                    <button onclick="openAddQuestionModal(${chapterId})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs flex items-center gap-1.5 shadow">
                        <i data-lucide="plus" class="w-4 h-4"></i> Tambah Soal Baru
                    </button>
                </div>
                <h3 class="text-xl font-extrabold text-slate-800 mb-4">Daftar Soal Bab ${chapterId} (${questions.length} Soal)</h3>
                <div class="space-y-4">
                    ${qListHtml || '<p class="text-slate-400 italic">Belum ada soal untuk bab ini.</p>'}
                </div>
            `;
            lucide.createIcons();
        }

        function openAddQuestionModal(chapterId) {
            const area = document.getElementById('admin-content-area');
            area.innerHTML = `
                <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-6 sm:p-8 border-2 border-indigo-200">
                    <h3 class="text-xl font-extrabold text-slate-800 mb-4">Tambah Soal Baru - Bab ${chapterId}</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Stimulus / Pertanyaan Soal</label>
                            <textarea id="new-q-stimulus" rows="3" placeholder="Tuliskan pertanyaan kuis di sini..." class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-indigo-500 focus:outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilihan A</label>
                            <input type="text" id="new-q-opt0" placeholder="Pilihan jawaban A" class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilihan B</label>
                            <input type="text" id="new-q-opt1" placeholder="Pilihan jawaban B" class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilihan C</label>
                            <input type="text" id="new-q-opt2" placeholder="Pilihan jawaban C" class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kunci Jawaban Benar</label>
                            <select id="new-q-answer" class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium bg-white">
                                <option value="0">Pilihan A</option>
                                <option value="1">Pilihan B</option>
                                <option value="2">Pilihan C</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Penjelasan Jawaban</label>
                            <textarea id="new-q-explanation" rows="2" placeholder="Penjelasan mengapa jawaban tersebut benar..." class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm font-medium focus:border-indigo-500 focus:outline-none"></textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-4">
                            <button onclick="renderAdminChapterQuestions(${chapterId})" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition">Batal</button>
                            <button onclick="saveNewQuestion(${chapterId})" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow transition">Simpan Soal</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveNewQuestion(chapterId) {
            const stimulus = document.getElementById('new-q-stimulus').value.trim();
            const opt0 = document.getElementById('new-q-opt0').value.trim();
            const opt1 = document.getElementById('new-q-opt1').value.trim();
            const opt2 = document.getElementById('new-q-opt2').value.trim();
            const answer = parseInt(document.getElementById('new-q-answer').value);
            const explanation = document.getElementById('new-q-explanation').value.trim();

            if (!stimulus || !opt0 || !opt1 || !opt2) {
                showToast("Mohon lengkapi pertanyaan dan pilihan jawaban!", "error");
                return;
            }

            let allQuestions = getData('tik_questions');
            if (!allQuestions[chapterId]) allQuestions[chapterId] = [];

            const newId = Date.now();
            allQuestions[chapterId].push({
                id: newId,
                stimulus: stimulus,
                options: [opt0, opt1, opt2],
                answer: answer,
                explanation: explanation || "Bagus sekali! Tetap semangat belajar TIK."
            });

            saveData('tik_questions', allQuestions);
            renderAdminChapterQuestions(chapterId);
        }

        function deleteQuestion(chapterId, qId) {
            if (!confirm("Apakah Anda yakin ingin menghapus soal ini?")) return;
            let allQuestions = getData('tik_questions');
            allQuestions[chapterId] = allQuestions[chapterId].filter(q => q.id !== qId);
            saveData('tik_questions', allQuestions);
            renderAdminChapterQuestions(chapterId);
        }

        // --- ADMIN: KELOLA KISI-KISI ---
        function renderAdminKisi(container) {
            const kisi = getData('tik_kisi');
            let html = `
                <div class="mb-6">
                    <h2 class="text-2xl font-extrabold text-slate-800">Kelola Kisi-Kisi PSAS 1</h2>
                    <p class="text-slate-600 text-sm">Sesuaikan poin-poin kisi-kisi ujian agar selalu selaras dengan materi terbaru.</p>
                </div>
                <div class="space-y-6">
            `;

            kisi.forEach((item, idx) => {
                html += `
                    <div class="bg-white rounded-3xl shadow-md p-6 border-2 border-slate-100">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="w-8 h-8 bg-indigo-100 text-indigo-700 rounded-xl flex items-center justify-center text-sm font-bold">${idx + 1}</span>
                            <input type="text" id="kisi-chapter-${idx}" value="${item.chapter}" class="w-28 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold">
                            <input type="text" id="kisi-title-${idx}" value="${item.title}" class="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 text-sm font-bold">
                        </div>
                        <div class="space-y-2 mb-4">
                            <label class="block text-xs font-bold text-slate-500 uppercase">Poin-poin Kisi-kisi (Pisahkan dengan baris baru)</label>
                            <textarea id="kisi-points-${idx}" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-medium content-andika">${item.points.join('\n')}</textarea>
                        </div>
                        <div class="flex justify-end">
                            <button onclick="saveKisiChanges(${idx})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow transition flex items-center gap-1.5">
                                <i data-lucide="save" class="w-4 h-4"></i> Simpan Kisi-Kisi Ini
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function saveKisiChanges(idx) {
            let kisi = getData('tik_kisi');
            kisi[idx].chapter = document.getElementById(`kisi-chapter-${idx}`).value;
            kisi[idx].title = document.getElementById(`kisi-title-${idx}`).value;
            const ptsText = document.getElementById(`kisi-points-${idx}`).value;
            kisi[idx].points = ptsText.split('\n').filter(p => p.trim() !== '');

            saveData('tik_kisi', kisi);
            renderAdminContent();
        }

        // --- ADMIN: LEADERBOARD MONITOR ---
        function renderAdminLeaderboard(container) {
            let lb = getData('tik_leaderboard');
            lb.sort((a, b) => b.score - a.score);

            let rows = '';
            lb.forEach((u, idx) => {
                rows += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="p-4 font-bold text-slate-700">#${idx + 1}</td>
                        <td class="p-4 flex items-center gap-3">
                            <span class="text-2xl">${u.avatar || '🐱'}</span>
                            <span class="font-bold text-slate-800">${u.name}</span>
                        </td>
                        <td class="p-4 font-medium text-slate-600">Kelas ${u.class}</td>
                        <td class="p-4 font-extrabold text-amber-600">${u.score} Poin</td>
                        <td class="p-4 text-right">
                            <button onclick="resetUserScore('${u.name}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold transition">Reset Poin</button>
                        </td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border-2 border-slate-100 p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2 class="text-xl font-extrabold text-slate-800">Monitor Leaderboard Siswa</h2>
                            <p class="text-slate-500 text-sm">Pantau perolehan skor kuis seluruh siswa secara real-time.</p>
                        </div>
                        <button onclick="resetAllScores()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs shadow transition">Reset Seluruh Skor</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                    <th class="p-4">Rank</th>
                                    <th class="p-4">Nama Siswa</th>
                                    <th class="p-4">Kelas</th>
                                    <th class="p-4">Skor</th>
                                    <th class="p-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows || '<tr><td colspan="5" class="p-6 text-center text-slate-400">Belum ada data siswa di leaderboard.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function resetUserScore(name) {
            if (!confirm(`Reset skor untuk ${name}?`)) return;
            let lb = getData('tik_leaderboard');
            let u = lb.find(item => item.name.toLowerCase() === name.toLowerCase());
            if (u) u.score = 0;
            saveData('tik_leaderboard', lb);
            renderAdminContent();
        }

        function resetAllScores() {
            if (!confirm("Apakah Anda yakin ingin mereset seluruh skor semua siswa menjadi 0?")) return;
            let lb = getData('tik_leaderboard');
            lb.forEach(u => u.score = 0);
            saveData('tik_leaderboard', lb);
            renderAdminContent();
        }
    </script>
</body>
</html>
